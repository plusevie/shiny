# managed by shiny-theme ({{THEME}}) — edit templates/ghostty.conf, not this file

theme = {{GHOSTTY_THEME}}

# Plain xterm-256color everywhere: nothing installed on remote hosts.
term = xterm-256color

font-size = 14
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
background-opacity = {{OPACITY}}
background-blur = {{BLUR}}
macos-titlebar-style = tabs
macos-option-as-alt = left

cursor-style = block
cursor-style-blink = false
cursor-color = {{ACCENT2}}
selection-background = {{SELECTION}}
selection-foreground = {{FG}}

# Splits (cmd+d / cmd+shift+d, cmd+opt+arrows to move)
unfocused-split-opacity = 0.85
split-divider-color = {{SURFACE}}

mouse-hide-while-typing = true
